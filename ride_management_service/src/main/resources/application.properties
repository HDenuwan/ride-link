spring.application.name=ride-management-service
server.port=8083

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ridelink_rides}

# JWT
jwt.secret=${JWT_SECRET:ridelink-super-secret-key-must-be-at-least-256-bits-long-for-hs256}

# Inter-service URLs (synchronous REST calls)
service.driver.base-url=${DRIVER_SERVICE_URL:http://localhost:8082}
service.fare.base-url=${FARE_SERVICE_URL:http://localhost:8084}

# SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.ridelink=DEBUG
