spring.application.name=fare-payment-service
server.port=8084

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ridelink_payments}

# JWT
jwt.secret=${JWT_SECRET:ridelink-super-secret-key-must-be-at-least-256-bits-long-for-hs256}

# Inter-service URLs
service.ride.base-url=${RIDE_SERVICE_URL:http://localhost:8083}

# Fare calculation rules (documented, configurable)
fare.base-rate=50.00
fare.per-km-rate=25.00
fare.night-surcharge-percent=20
fare.peak-surcharge-percent=15

# SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.ridelink=DEBUG
