spring.application.name=driver-vehicle-service
server.port=8082

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ridelink_drivers}

# JWT (same secret as Account Service for token validation)
jwt.secret=${JWT_SECRET:ridelink-super-secret-key-must-be-at-least-256-bits-long-for-hs256}

# SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.ridelink=DEBUG
