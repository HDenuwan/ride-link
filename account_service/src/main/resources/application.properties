spring.application.name=account-service
server.port=8081

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ridelink_accounts}

# JWT
jwt.secret=${JWT_SECRET:ridelink-super-secret-key-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# SpringDoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.ridelink=DEBUG
